services:
    - type: web
    name: quflati-technician-backend
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: node src/server.js
    envVars:
            - key: DATABASE_URL
        fromDatabase:
          name: quflati-db
          property: connectionString
            - key: JWT_SECRET
        generateValue: true

databases:
    - name: quflati-db
    databaseName: quflati
    plan: free
